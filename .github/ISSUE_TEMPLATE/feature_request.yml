name: Feature request / 功能建议
description: Describe a concrete problem and desired behavior. 可使用中文填写。
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 遇到的问题
      description: Describe the actual situation and current workaround.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Desired behavior / 期望行为
      description: Explain with a concrete example; use synthetic data if needed. 示例请使用合成数据。
    validations:
      required: true
  - type: textarea
    id: considerations
    attributes:
      label: Context and constraints / 背景与限制
      description: Include relevant scope or constraints without personal or account data.
    validations:
      required: false
  - type: markdown
    attributes:
      value: >-
        Proposals are reviewed as time allows, without feature or platform-support commitments. Use synthetic examples and exclude real chats, account data, exports, and credentials. 项目不承诺实现建议；请使用合成示例，勿附真实数据或凭据。
