name: Bug report / 问题报告
description: Report a reproducible public-version issue. 可使用中文填写。
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: Extension version / 扩展版本
      description: Include the extension version, or identify the affected repository script or demo.
      placeholder: "0.8.12"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: Browser version and operating system; include Node.js for script issues.
      placeholder: "Chrome version, Windows / macOS / Linux"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
      description: Provide a minimal reproduction using synthetic data. 请使用合成数据。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior / 预期与实际结果
      description: Include only necessary error codes or redacted log excerpts.
    validations:
      required: true
  - type: markdown
    attributes:
      value: >-
        Do not attach real chats, UIDs, recruiter contacts, verification codes, Cookies, pairing tokens, keys, or complete real exports. Report security issues privately under SECURITY.md. 请勿附上真实聊天或凭据；安全漏洞请按 SECURITY_CN.md 私下报告。
