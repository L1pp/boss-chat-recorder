name: Build and publish Chrome Web Store extension

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build a package, check store status, upload a package, or submit it for review.
        type: choice
        required: true
        default: build
        options:
          - build
          - status
          - upload
          - publish
      build_run_id:
        description: Reuse the ZIP from a successful main release run; leave empty to build and test once.
        type: string
        required: false
        default: ''
      github_release:
        description: Also create a GitHub Release with the selected ZIP (ignored for status).
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  prepare:
    if: ${{ inputs.operation != 'status' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      needs_build: ${{ steps.source.outputs.needs_build }}
      version: ${{ steps.source.outputs.version }}
      run_id: ${{ steps.source.outputs.run_id }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      artifact_name: ${{ steps.source.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Select a new build or a tested main release artifact
        id: source
        env:
          RELEASE_OPERATION: ${{ inputs.operation }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-artifact.mjs

  package:
    needs: prepare
    if: ${{ needs.prepare.outputs.needs_build == 'true' }}
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build public extension bundles
        run: npm run build

      - name: Install browser test dependencies
        run: npm ci --ignore-scripts

      - name: Run offline tests
        run: npm test

      - name: Check public source and release contents
        run: npm run check

      - name: Run synthetic browser regression
        run: npm run test:browser

      - name: Save browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-browser-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Package the allowlisted Chrome extension files
        run: node scripts/package-extension.mjs --output "$RUNNER_TEMP/boss-chat-recorder.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: ${{ runner.temp }}/boss-chat-recorder.zip
          if-no-files-found: error
          retention-days: 14

  chrome-web-store:
    needs:
      - prepare
      - package
    if: >-
      ${{ always() && !cancelled() && (
        inputs.operation == 'status' ||
        (github.ref == 'refs/heads/main' &&
          (inputs.operation == 'upload' || inputs.operation == 'publish') &&
          needs.prepare.result == 'success' && (
            (needs.prepare.outputs.needs_build == 'true' && needs.package.result == 'success') ||
            (needs.prepare.outputs.needs_build == 'false' && needs.package.result == 'skipped')
          ))
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: chrome-web-store-${{ inputs.operation == 'status' && github.run_id || 'phaihpchfdihnclgjhpmpnhobdcogdhb' }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download the selected original package
        if: ${{ inputs.operation == 'upload' || inputs.operation == 'publish' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: ${{ runner.temp }}
          run-id: ${{ needs.prepare.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - uses: google-github-actions/auth@v3
        id: google-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: >-
            ${{ inputs.operation == 'status' && 'https://www.googleapis.com/auth/chromewebstore.readonly' || 'https://www.googleapis.com/auth/chromewebstore' }}
          create_credentials_file: false
          export_environment_variables: false

      - name: Check Chrome Web Store item status
        if: ${{ inputs.operation == 'status' }}
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: phaihpchfdihnclgjhpmpnhobdcogdhb
        run: node scripts/chrome-webstore.mjs status

      - name: Upload package to Chrome Web Store
        id: upload
        if: ${{ inputs.operation == 'upload' || inputs.operation == 'publish' }}
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: phaihpchfdihnclgjhpmpnhobdcogdhb
        run: node scripts/chrome-webstore.mjs upload --zip "$RUNNER_TEMP/boss-chat-recorder.zip"

      - name: Submit the uploaded item for review
        if: ${{ inputs.operation == 'publish' && steps.upload.outcome == 'success' }}
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: phaihpchfdihnclgjhpmpnhobdcogdhb
        run: node scripts/chrome-webstore.mjs publish

  github-release:
    needs:
      - prepare
      - package
      - chrome-web-store
    if: >-
      ${{ always() && !cancelled() && github.ref == 'refs/heads/main' &&
        inputs.github_release && inputs.operation != 'status' && needs.prepare.result == 'success' && (
          (needs.prepare.outputs.needs_build == 'true' && needs.package.result == 'success') ||
          (needs.prepare.outputs.needs_build == 'false' && needs.package.result == 'skipped')
        ) && (inputs.operation == 'build' || needs.chrome-web-store.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: ${{ runner.temp }}
          run-id: ${{ needs.prepare.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Create GitHub Release with the extension ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: >-
          gh release create "v${RELEASE_VERSION}" "$RUNNER_TEMP/boss-chat-recorder.zip"
          --target "$RELEASE_SOURCE_SHA"
          --title "BOSS Chat Recorder v${RELEASE_VERSION}"
          --notes "Public Chrome extension package built from commit ${RELEASE_SOURCE_SHA}."
