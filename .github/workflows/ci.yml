name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run check
      - name: Package public extension
        run: node scripts/package-extension.mjs --output "$RUNNER_TEMP/boss-chat-recorder.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: boss-chat-recorder-ci
          path: ${{ runner.temp }}/boss-chat-recorder.zip
          if-no-files-found: error
          retention-days: 14
