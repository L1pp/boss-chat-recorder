name: Automated tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    name: Offline tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Node tests and LCOV coverage
        run: npm run test:coverage
      - name: Check generated bundles and public source
        run: npm run check
      - name: Package public extension
        run: node scripts/package-extension.mjs --output "${{ runner.temp }}/boss-chat-recorder.zip"
      - name: Save coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ runner.os }}
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7
      - name: Save extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: boss-chat-recorder-${{ runner.os }}-ci
          path: ${{ runner.temp }}/boss-chat-recorder.zip
          if-no-files-found: error
          retention-days: 14
  browser:
    name: Chromium synthetic regression
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Build public extension
        run: npm run build
      - name: Run browser regression with synthetic profiles
        run: npm run test:browser
      - name: Save browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: chromium-test-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
